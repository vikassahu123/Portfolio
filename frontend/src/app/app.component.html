<main class="portfolio-app-root">
  <!-- Sticky Glassmorphic Navbar -->
  <app-navbar></app-navbar>

  <!-- Hero Section with Ambient Canvas & System Profile Terminal -->
  <app-hero [profile]="profile"></app-hero>

  <!-- About & Systems Philosophy Section -->
  <app-about [profile]="profile"></app-about>

  <!-- Technical Competencies & Categorized Skills -->
  <app-skills [skills]="skills"></app-skills>

  <!-- Enterprise Experience Milestones Timeline -->
  <app-experience [experiences]="experiences"></app-experience>

  <!-- Featured Projects & AI Architectures Showcase -->
  <app-projects [projects]="projects"></app-projects>

  <!-- Freelance & Consulting Services Section -->
  <app-freelance 
    [services]="services" 
    (serviceSelected)="handleServiceSelected($event)">
  </app-freelance>

  <!-- Direct Contact & Inquiry Booking Form -->
  <app-contact [profile]="profile"></app-contact>

  <!-- Brand Signature Footer -->
  <app-footer [profile]="profile"></app-footer>

  <!-- Mobile Floating Quick-Hire Action Dock (High-converting mobile recruitment experience) -->
  <div class="mobile-floating-hire-dock">
    <div class="dock-inner">
      <div class="dock-status">
        <span class="dock-pulse"></span>
        <div class="dock-info">
          <span class="dock-title">Vikas Sahu</span>
          <span class="dock-sub">Available to Hire Now</span>
        </div>
      </div>
      <div class="dock-actions">
        <a [href]="getInstagramUrl()" target="_blank" rel="noopener noreferrer" class="dock-btn dock-btn-insta" title="Instagram (&#64;vikasofftrack)">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" viewBox="0 0 24 24">
            <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
          </svg>
          <span>Instagram</span>
        </a>
        <a href="#contact" class="dock-btn dock-btn-hire">
          <span>⚡ Hire Me</span>
        </a>
      </div>
    </div>
  </div>

  <!-- Notification Toast Container -->
  <div class="toast-container" *ngIf="toasts.length > 0">
    <div *ngFor="let toast of toasts" class="toast-card" [ngClass]="toast.type">
      <div class="toast-content">
        <strong class="toast-title">{{ toast.title }}</strong>
        <p class="toast-msg">{{ toast.message }}</p>
      </div>
      <button class="toast-close" (click)="dismissToast(toast.id)">✕</button>
    </div>
  </div>
</main>
