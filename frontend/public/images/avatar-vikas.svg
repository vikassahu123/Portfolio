<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="avatar-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="teal-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Ring -->
  <circle cx="100" cy="100" r="94" fill="none" stroke="url(#teal-accent)" stroke-width="3" filter="url(#glow)"/>
  <circle cx="100" cy="100" r="90" fill="url(#avatar-bg)"/>

  <!-- Developer Silhouette with Tech Aura -->
  <!-- Head -->
  <circle cx="100" cy="74" r="32" fill="#cbd5e1"/>
  <!-- Glasses / Developer Eyes -->
  <rect x="80" y="70" width="16" height="8" rx="2" fill="#0f172a"/>
  <rect x="104" y="70" width="16" height="8" rx="2" fill="#0f172a"/>
  <line x1="96" y1="74" x2="104" y2="74" stroke="#0f172a" stroke-width="2"/>
  
  <!-- Shoulders & Torso -->
  <path d="M48 160 C48 120 72 114 100 114 C128 114 152 120 152 160 Z" fill="#334155"/>
  <path d="M78 120 L100 144 L122 120 Z" fill="#0284c7" opacity="0.6"/>

  <!-- Tech Monogram Badge -->
  <circle cx="154" cy="154" r="22" fill="#030712" stroke="#2dd4bf" stroke-width="2"/>
  <text x="154" y="160" fill="#2dd4bf" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="bold" text-anchor="middle">VS</text>
</svg>
