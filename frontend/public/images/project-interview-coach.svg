<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="interview-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070d1a"/>
      <stop offset="50%" stop-color="#0b1324"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="amber-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="glow-amber" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Canvas Background matching site palette -->
  <rect width="600" height="360" rx="16" fill="url(#interview-bg)" stroke="#1e293b" stroke-width="2"/>

  <!-- Subtle Cybernetic Grid -->
  <g opacity="0.12">
    <path d="M0 60 H600 M0 120 H600 M0 180 H600 M0 240 H600 M0 300 H600" stroke="#f59e0b" stroke-width="1"/>
    <path d="M60 0 V360 M120 0 V360 M180 0 V360 M240 0 V360 M300 0 V360 M360 0 V360 M420 0 V360 M480 0 V360 M540 0 V360" stroke="#f59e0b" stroke-width="1"/>
  </g>

  <!-- Ambient Glow -->
  <circle cx="140" cy="180" r="100" fill="#f59e0b" opacity="0.05" filter="url(#glow-amber)"/>
  <circle cx="480" cy="160" r="90" fill="#2dd4bf" opacity="0.05"/>

  <!-- Main Interface Window Card -->
  <g transform="translate(40, 32)">
    <rect width="520" height="296" rx="12" fill="#030712" fill-opacity="0.88" stroke="#334155" stroke-width="1.5"/>

    <!-- Window Title Bar -->
    <rect width="520" height="36" rx="12" fill="#0b1324"/>
    <rect y="24" width="520" height="12" fill="#0b1324"/>
    <circle cx="20" cy="18" r="5" fill="#ef4444"/>
    <circle cx="36" cy="18" r="5" fill="#f59e0b"/>
    <circle cx="52" cy="18" r="5" fill="#10b981"/>
    <text x="76" y="22" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">ai-interview-coach // conversational evaluation robot</text>
    <rect x="420" y="10" width="85" height="16" rx="8" fill="rgba(245, 158, 11, 0.12)" stroke="rgba(245, 158, 11, 0.3)"/>
    <text x="430" y="22" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="9">EVALUATION</text>

    <!-- LEFT PANEL: Futuristic AI Interviewer Robot -->
    <g transform="translate(18, 52)">
      <rect width="138" height="226" rx="10" fill="#070d1a" stroke="rgba(245, 158, 11, 0.25)"/>

      <!-- Robot Avatar -->
      <g transform="translate(69, 78)">
        <!-- Outer Concentric Scanner Ring -->
        <circle cx="0" cy="0" r="46" fill="none" stroke="#f59e0b" stroke-width="1" stroke-dasharray="4 3" opacity="0.4"/>
        <circle cx="0" cy="-6" r="34" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>

        <!-- Robot Cranium -->
        <path d="M-22 -18 C-22 -34, 22 -34, 22 -18 C22 -4, 16 8, 0 10 C-16 8, -22 -4, -22 -18 Z" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/>

        <!-- Glowing Robot Visor / Scanning Eyes -->
        <rect x="-14" y="-14" width="28" height="7" rx="3.5" fill="#f59e0b" filter="url(#glow-amber)"/>
        <circle cx="-6" cy="-10.5" r="2" fill="#ffffff"/>
        <circle cx="6" cy="-10.5" r="2" fill="#ffffff"/>

        <!-- Audio Communication Nodes -->
        <circle cx="-23" cy="-12" r="4" fill="#f59e0b"/>
        <circle cx="23" cy="-12" r="4" fill="#f59e0b"/>
        <line x1="0" y1="-34" x2="0" y2="-44" stroke="#f59e0b" stroke-width="2"/>
        <circle cx="0" cy="-44" r="3" fill="#f59e0b"/>

        <!-- Neck & Robotic Collar -->
        <rect x="-8" y="10" width="16" height="10" fill="#0b1324" stroke="#334155"/>
        <path d="M-28 20 L28 20 L36 54 L-36 54 Z" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
        <!-- Central Evaluation Core -->
        <circle cx="0" cy="34" r="8" fill="rgba(245, 158, 11, 0.2)" stroke="#f59e0b" stroke-width="1.5"/>
        <circle cx="0" cy="34" r="3" fill="#f59e0b" filter="url(#glow-amber)"/>
      </g>

      <!-- Robot Status Label -->
      <rect x="14" y="156" width="110" height="20" rx="4" fill="rgba(245, 158, 11, 0.08)" stroke="rgba(245, 158, 11, 0.25)"/>
      <text x="69" y="170" text-anchor="middle" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600">AI COACH: ACTIVE</text>
      
      <text x="69" y="194" text-anchor="middle" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8.5">Mock: Senior Eng</text>
      <text x="69" y="208" text-anchor="middle" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="8">LLM: Dynamic Eval</text>
    </g>

    <!-- RIGHT PANEL: Performance Radar & Real-Time Scoring -->
    <g transform="translate(170, 52)">
      <!-- Radar Chart & Metrics Card -->
      <rect width="334" height="136" rx="8" fill="#070d1a" stroke="#1e293b"/>
      
      <!-- Radar Chart Drawing -->
      <g transform="translate(74, 68)">
        <!-- Polygon Grid Layers -->
        <polygon points="0,-48 46,-15 28,40 -28,40 -46,-15" fill="none" stroke="#334155" stroke-width="1"/>
        <polygon points="0,-32 30,-10 18,26 -18,26 -30,-10" fill="none" stroke="#334155" stroke-width="1"/>
        <polygon points="0,-16 15,-5 9,13 -9,13 -15,-5" fill="none" stroke="#334155" stroke-width="1"/>
        
        <!-- Axis Lines -->
        <line x1="0" y1="0" x2="0" y2="-48" stroke="#334155" stroke-width="1"/>
        <line x1="0" y1="0" x2="46" y2="-15" stroke="#334155" stroke-width="1"/>
        <line x1="0" y1="0" x2="28" y2="40" stroke="#334155" stroke-width="1"/>
        <line x1="0" y1="0" x2="-28" y2="40" stroke="#334155" stroke-width="1"/>
        <line x1="0" y1="0" x2="-46" y2="-15" stroke="#334155" stroke-width="1"/>

        <!-- Candidate High-Score Radar Polygon -->
        <polygon points="0,-44 42,-12 25,35 -24,36 -40,-13" fill="rgba(245, 158, 11, 0.25)" stroke="#f59e0b" stroke-width="2"/>
        <circle cx="0" cy="-44" r="3" fill="#fbbf24"/>
        <circle cx="42" cy="-12" r="3" fill="#fbbf24"/>
        <circle cx="25" cy="35" r="3" fill="#fbbf24"/>
        <circle cx="-24" cy="36" r="3" fill="#fbbf24"/>
        <circle cx="-40" cy="-13" r="3" fill="#fbbf24"/>

        <!-- Axis Labels -->
        <text x="0" y="-53" text-anchor="middle" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="7.5">System Design</text>
        <text x="50" y="-12" fill="#2dd4bf" font-family="'JetBrains Mono', monospace" font-size="7.5">Coding</text>
        <text x="32" y="48" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="7.5">Architecture</text>
        <text x="-32" y="48" text-anchor="end" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="7.5">Problem Solve</text>
        <text x="-50" y="-12" text-anchor="end" fill="#2dd4bf" font-family="'JetBrains Mono', monospace" font-size="7.5">Communication</text>
      </g>

      <!-- Score Summary Box -->
      <g transform="translate(162, 16)">
        <text x="0" y="14" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="12" font-weight="700">Interview Evaluation</text>
        <text x="0" y="28" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9">Dynamic Technical Assessment</text>

        <rect x="0" y="38" width="158" height="66" rx="6" fill="#0b1324" stroke="rgba(245, 158, 11, 0.3)"/>
        <text x="12" y="56" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8.5">COMPOSITE SCORE</text>
        <text x="12" y="80" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="700">95.4%</text>
        <text x="82" y="80" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="600">STRONG HIRE</text>
        <text x="12" y="96" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="8">Response Latency: 1.2s avg</text>
      </g>

      <!-- Real-Time AI Feedback Box -->
      <g transform="translate(0, 148)">
        <rect width="334" height="78" rx="8" fill="#070d1a" stroke="rgba(45, 212, 191, 0.25)"/>
        <rect width="334" height="24" rx="8" fill="rgba(45, 212, 191, 0.08)"/>
        <text x="14" y="16" fill="#2dd4bf" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">⚡ LIVE ROBOT COACHING FEEDBACK</text>
        <circle cx="316" cy="12" r="4" fill="#2dd4bf"/>

        <text x="14" y="42" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="9.5">
          "Excellent breakdown of distributed transactions and MySQL indexing."
        </text>
        <text x="14" y="60" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8.5">
          Next challenge: Handle split-brain scenarios in microservices clusters.
        </text>
      </g>
    </g>
  </g>
</svg>
