<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="meeting-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070d1a"/>
      <stop offset="50%" stop-color="#0b1324"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="purple-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Canvas Background matching site palette -->
  <rect width="600" height="360" rx="16" fill="url(#meeting-bg)" stroke="#1e293b" stroke-width="2"/>

  <!-- Subtle Cybernetic Grid -->
  <g opacity="0.12">
    <path d="M0 60 H600 M0 120 H600 M0 180 H600 M0 240 H600 M0 300 H600" stroke="#38bdf8" stroke-width="1"/>
    <path d="M60 0 V360 M120 0 V360 M180 0 V360 M240 0 V360 M300 0 V360 M360 0 V360 M420 0 V360 M480 0 V360 M540 0 V360" stroke="#38bdf8" stroke-width="1"/>
  </g>

  <!-- Ambient background glow circles -->
  <circle cx="140" cy="180" r="100" fill="#2dd4bf" opacity="0.05" filter="url(#glow)"/>
  <circle cx="480" cy="160" r="90" fill="#38bdf8" opacity="0.05" filter="url(#glow)"/>

  <!-- Main Interface Window Card -->
  <g transform="translate(40, 32)">
    <rect width="520" height="296" rx="12" fill="#030712" fill-opacity="0.88" stroke="#334155" stroke-width="1.5"/>

    <!-- Window Title Bar -->
    <rect width="520" height="36" rx="12" fill="#0b1324"/>
    <rect y="24" width="520" height="12" fill="#0b1324"/>
    <circle cx="20" cy="18" r="5" fill="#ef4444"/>
    <circle cx="36" cy="18" r="5" fill="#f59e0b"/>
    <circle cx="52" cy="18" r="5" fill="#10b981"/>
    <text x="76" y="22" fill="#2dd4bf" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">ai-meeting-intelligence // audio transcript &amp; robot agent</text>
    <rect x="420" y="10" width="85" height="16" rx="8" fill="rgba(45, 212, 191, 0.12)" stroke="rgba(45, 212, 191, 0.3)"/>
    <text x="432" y="22" fill="#2dd4bf" font-family="'JetBrains Mono', monospace" font-size="9">LIVE SYNC</text>

    <!-- LEFT PANEL: Futuristic AI Speech Robot Avatar -->
    <g transform="translate(18, 52)">
      <rect width="138" height="226" rx="10" fill="#070d1a" stroke="rgba(45, 212, 191, 0.2)"/>

      <!-- Robot Head & Torso Vector Illustration -->
      <g transform="translate(69, 78)">
        <!-- Outer Halo Glow -->
        <circle cx="0" cy="0" r="46" fill="none" stroke="#2dd4bf" stroke-width="1" stroke-dasharray="3 3" opacity="0.4"/>
        <circle cx="0" cy="-6" r="34" fill="#0f172a" stroke="#2dd4bf" stroke-width="2"/>

        <!-- Robot Head Shell -->
        <path d="M-22 -18 C-22 -34, 22 -34, 22 -18 C22 -4, 16 8, 0 10 C-16 8, -22 -4, -22 -18 Z" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>

        <!-- Glowing Neon Robot Visor/Eyes -->
        <rect x="-14" y="-14" width="28" height="7" rx="3.5" fill="#2dd4bf" filter="url(#glow)"/>
        <circle cx="-6" cy="-10.5" r="2" fill="#ffffff"/>
        <circle cx="6" cy="-10.5" r="2" fill="#ffffff"/>

        <!-- Cybernetic Headset & Antenna -->
        <line x1="22" y1="-12" x2="30" y2="-22" stroke="#2dd4bf" stroke-width="2"/>
        <circle cx="30" cy="-22" r="3" fill="#2dd4bf"/>
        <rect x="-26" y="-12" width="5" height="12" rx="2" fill="#38bdf8"/>
        <rect x="21" y="-12" width="5" height="12" rx="2" fill="#38bdf8"/>

        <!-- Neck & Torso -->
        <rect x="-8" y="10" width="16" height="10" fill="#0b1324" stroke="#334155"/>
        <path d="M-28 20 L28 20 L36 54 L-36 54 Z" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
        <!-- Chest Core Indicator -->
        <circle cx="0" cy="34" r="8" fill="rgba(45, 212, 191, 0.2)" stroke="#2dd4bf" stroke-width="1.5"/>
        <circle cx="0" cy="34" r="3" fill="#2dd4bf" filter="url(#glow)"/>
      </g>

      <!-- Robot Status Label -->
      <rect x="14" y="156" width="110" height="20" rx="4" fill="rgba(45, 212, 191, 0.08)" stroke="rgba(45, 212, 191, 0.25)"/>
      <text x="69" y="170" text-anchor="middle" fill="#2dd4bf" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600">AI AGENT: ACTIVE</text>
      
      <text x="69" y="194" text-anchor="middle" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8.5">Diarization: 4 Spkrs</text>
      <text x="69" y="208" text-anchor="middle" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="8">LLM: Gemini Flash</text>
    </g>

    <!-- RIGHT PANEL: Audio Waveforms & Extracted Meeting Intelligence -->
    <g transform="translate(170, 52)">
      <!-- Audio Waveform Stream Banner -->
      <rect width="334" height="66" rx="8" fill="#070d1a" stroke="#1e293b"/>
      <text x="14" y="20" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="11" font-weight="700">Multi-Channel Audio Stream Analysis</text>
      <text x="14" y="34" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9">Frequency: 44.1kHz • Latency: 38ms • Status: Transcribing</text>

      <!-- Glowing Audio Wave Bars -->
      <g transform="translate(14, 42)">
        <rect x="0" y="4" width="3" height="14" rx="1.5" fill="#2dd4bf"/>
        <rect x="6" y="0" width="3" height="18" rx="1.5" fill="#2dd4bf"/>
        <rect x="12" y="6" width="3" height="12" rx="1.5" fill="#38bdf8"/>
        <rect x="18" y="2" width="3" height="16" rx="1.5" fill="#38bdf8"/>
        <rect x="24" y="8" width="3" height="10" rx="1.5" fill="#818cf8"/>
        <rect x="30" y="1" width="3" height="17" rx="1.5" fill="#818cf8"/>
        <rect x="36" y="5" width="3" height="13" rx="1.5" fill="#2dd4bf"/>
        <rect x="42" y="0" width="3" height="18" rx="1.5" fill="#2dd4bf"/>
        <rect x="48" y="7" width="3" height="11" rx="1.5" fill="#38bdf8"/>
        <rect x="54" y="3" width="3" height="15" rx="1.5" fill="#38bdf8"/>
        <rect x="60" y="1" width="3" height="17" rx="1.5" fill="#c084fc"/>
        <rect x="66" y="6" width="3" height="12" rx="1.5" fill="#c084fc"/>
        <rect x="72" y="2" width="3" height="16" rx="1.5" fill="#2dd4bf"/>
        <rect x="78" y="5" width="3" height="13" rx="1.5" fill="#2dd4bf"/>
        <rect x="84" y="8" width="3" height="10" rx="1.5" fill="#38bdf8"/>
        <rect x="90" y="0" width="3" height="18" rx="1.5" fill="#38bdf8"/>
        <rect x="96" y="4" width="3" height="14" rx="1.5" fill="#818cf8"/>
        <rect x="102" y="2" width="3" height="16" rx="1.5" fill="#818cf8"/>
        <rect x="108" y="6" width="3" height="12" rx="1.5" fill="#2dd4bf"/>
        <rect x="114" y="1" width="3" height="17" rx="1.5" fill="#2dd4bf"/>

        <!-- Mini waveform line -->
        <path d="M125 9 Q 150 0, 175 9 T 225 9 T 275 9 T 300 9" fill="none" stroke="#2dd4bf" stroke-width="1.5" opacity="0.8"/>
      </g>

      <!-- Key Action Items & Decision Matrix -->
      <g transform="translate(0, 78)">
        <rect width="334" height="148" rx="8" fill="#070d1a" stroke="rgba(45, 212, 191, 0.25)"/>
        
        <!-- Header -->
        <rect width="334" height="28" rx="8" fill="rgba(45, 212, 191, 0.08)"/>
        <text x="14" y="18" fill="#2dd4bf" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700">⚡ LLM EXTRACTED DECISION MATRIX</text>
        <circle cx="316" cy="14" r="4" fill="#10b981"/>

        <!-- Item 1 -->
        <g transform="translate(14, 40)">
          <rect x="0" y="-4" width="16" height="16" rx="4" fill="rgba(16, 185, 129, 0.15)"/>
          <text x="4" y="8" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="10">✓</text>
          <text x="24" y="4" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="10" font-weight="600">Actionable Sprint Milestone</text>
          <text x="24" y="17" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="9">Migrate checkout to asynchronous Java microservices</text>
        </g>

        <!-- Item 2 -->
        <g transform="translate(14, 76)">
          <rect x="0" y="-4" width="16" height="16" rx="4" fill="rgba(56, 189, 248, 0.15)"/>
          <text x="4" y="8" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10">✓</text>
          <text x="24" y="4" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="10" font-weight="600">Semantic Search Vectorization</text>
          <text x="24" y="17" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="9">Store embeddings for instant meeting historical lookup</text>
        </g>

        <!-- Item 3 -->
        <g transform="translate(14, 112)">
          <rect x="0" y="-4" width="16" height="16" rx="4" fill="rgba(245, 158, 11, 0.15)"/>
          <text x="4" y="8" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="10">✓</text>
          <text x="24" y="4" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="10" font-weight="600">Automated Follow-up Dispatch</text>
          <text x="24" y="17" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="9">Vikas Sahu to trigger summary broadcast via n8n bot</text>
        </g>
      </g>
    </g>
  </g>
</svg>
