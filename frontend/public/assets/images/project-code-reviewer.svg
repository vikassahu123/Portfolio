<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="code-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070d1a"/>
      <stop offset="50%" stop-color="#0b1324"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="diff-green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="glow-teal" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Canvas Background matching site palette -->
  <rect width="600" height="360" rx="16" fill="url(#code-bg)" stroke="#1e293b" stroke-width="2"/>

  <!-- Subtle Cybernetic Grid -->
  <g opacity="0.12">
    <path d="M0 60 H600 M0 120 H600 M0 180 H600 M0 240 H600 M0 300 H600" stroke="#2dd4bf" stroke-width="1"/>
    <path d="M60 0 V360 M120 0 V360 M180 0 V360 M240 0 V360 M300 0 V360 M360 0 V360 M420 0 V360 M480 0 V360 M540 0 V360" stroke="#2dd4bf" stroke-width="1"/>
  </g>

  <!-- Ambient Glow -->
  <circle cx="140" cy="180" r="100" fill="#2dd4bf" opacity="0.05" filter="url(#glow-teal)"/>
  <circle cx="480" cy="160" r="90" fill="#f59e0b" opacity="0.05"/>

  <!-- Main Interface Window Card -->
  <g transform="translate(40, 32)">
    <rect width="520" height="296" rx="12" fill="#030712" fill-opacity="0.88" stroke="#334155" stroke-width="1.5"/>

    <!-- Window Title Bar -->
    <rect width="520" height="36" rx="12" fill="#0b1324"/>
    <rect y="24" width="520" height="12" fill="#0b1324"/>
    <circle cx="20" cy="18" r="5" fill="#ef4444"/>
    <circle cx="36" cy="18" r="5" fill="#f59e0b"/>
    <circle cx="52" cy="18" r="5" fill="#10b981"/>
    <text x="76" y="22" fill="#2dd4bf" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">autonomous-pr-bot // n8n &amp; gemini ai code reviewer robot</text>
    <rect x="420" y="10" width="85" height="16" rx="8" fill="rgba(16, 185, 129, 0.12)" stroke="rgba(16, 185, 129, 0.3)"/>
    <text x="432" y="22" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="9">AUDIT OK</text>

    <!-- LEFT PANEL: Futuristic AI Code Reviewer Robot Avatar -->
    <g transform="translate(18, 52)">
      <rect width="138" height="226" rx="10" fill="#070d1a" stroke="rgba(45, 212, 191, 0.25)"/>

      <!-- Robot Avatar -->
      <g transform="translate(69, 78)">
        <!-- Outer Optical Scanner Arc -->
        <circle cx="0" cy="0" r="46" fill="none" stroke="#2dd4bf" stroke-width="1" stroke-dasharray="4 2" opacity="0.4"/>
        <circle cx="0" cy="-6" r="34" fill="#0f172a" stroke="#2dd4bf" stroke-width="2"/>

        <!-- Robot Cranium -->
        <path d="M-22 -18 C-22 -34, 22 -34, 22 -18 C22 -4, 16 8, 0 10 C-16 8, -22 -4, -22 -18 Z" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>

        <!-- Glowing Robot Optical Scanner (Laser Eye) -->
        <rect x="-14" y="-14" width="28" height="7" rx="3.5" fill="#2dd4bf" filter="url(#glow-teal)"/>
        <circle cx="-6" cy="-10.5" r="2.5" fill="#ffffff"/>
        <circle cx="6" cy="-10.5" r="2.5" fill="#ffffff"/>

        <!-- Code Inspection Scanner Beam projection -->
        <polygon points="-14,-7 14,-7 26,18 -26,18" fill="rgba(45, 212, 191, 0.08)"/>

        <!-- Antenna & Circuit Nodes -->
        <line x1="-15" y1="-32" x2="-22" y2="-42" stroke="#2dd4bf" stroke-width="1.5"/>
        <circle cx="-22" cy="-42" r="2.5" fill="#2dd4bf"/>
        <line x1="15" y1="-32" x2="22" y2="-42" stroke="#38bdf8" stroke-width="1.5"/>
        <circle cx="22" cy="-42" r="2.5" fill="#38bdf8"/>

        <!-- Neck & Robotic Collar -->
        <rect x="-8" y="10" width="16" height="10" fill="#0b1324" stroke="#334155"/>
        <path d="M-28 20 L28 20 L36 54 L-36 54 Z" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
        <!-- Central Security Core -->
        <circle cx="0" cy="34" r="8" fill="rgba(16, 185, 129, 0.2)" stroke="#10b981" stroke-width="1.5"/>
        <text x="0" y="37" text-anchor="middle" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">&lt;/&gt;</text>
      </g>

      <!-- Robot Status Label -->
      <rect x="14" y="156" width="110" height="20" rx="4" fill="rgba(16, 185, 129, 0.08)" stroke="rgba(16, 185, 129, 0.25)"/>
      <text x="69" y="170" text-anchor="middle" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600">AUDITOR: ACTIVE</text>
      
      <text x="69" y="194" text-anchor="middle" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8.5">Engine: n8n Flow</text>
      <text x="69" y="208" text-anchor="middle" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="8">AI: Google Gemini</text>
    </g>

    <!-- RIGHT PANEL: GitHub PR Diff & Security Audit Logs -->
    <g transform="translate(170, 52)">
      <!-- PR Diff Code Snippet Box -->
      <rect width="334" height="128" rx="8" fill="#070d1a" stroke="#1e293b"/>
      
      <!-- PR Meta Bar -->
      <rect width="334" height="24" rx="8" fill="#0f172a"/>
      <text x="12" y="16" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">PR #48: feature/async-event-bus</text>
      <text x="248" y="16" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="8.5">+142</text>
      <text x="276" y="16" fill="#ef4444" font-family="'JetBrains Mono', monospace" font-size="8.5">-38</text>

      <!-- Syntax Highlighting & Diff Lines -->
      <g transform="translate(12, 34)" font-family="'JetBrains Mono', monospace" font-size="8.5">
        <!-- Line 1 -->
        <rect x="-4" y="0" width="316" height="16" fill="rgba(16, 185, 129, 0.08)"/>
        <text x="0" y="12" fill="#10b981">+</text>
        <text x="14" y="12" fill="#c084fc">public</text>
        <text x="56" y="12" fill="#38bdf8">CompletableFuture&lt;OrderDTO&gt;</text>
        <text x="214" y="12" fill="#f8fafc">processAsync()</text>

        <!-- Line 2 -->
        <rect x="-4" y="18" width="316" height="16" fill="rgba(16, 185, 129, 0.08)"/>
        <text x="0" y="30" fill="#10b981">+</text>
        <text x="14" y="30" fill="#f8fafc">  orderRepository.save(newOrder);</text>
        <text x="214" y="30" fill="#64748b">// ACID compliant</text>

        <!-- Line 3 -->
        <rect x="-4" y="36" width="316" height="16" fill="rgba(239, 68, 68, 0.08)"/>
        <text x="0" y="48" fill="#ef4444">-</text>
        <text x="14" y="48" fill="#ef4444">  Thread.sleep(5000); // Deprecated blocking delay</text>

        <!-- Line 4 -->
        <rect x="-4" y="54" width="316" height="16" fill="rgba(16, 185, 129, 0.08)"/>
        <text x="0" y="66" fill="#10b981">+</text>
        <text x="14" y="66" fill="#f8fafc">  eventPublisher.publishEvent(new OrderCreatedEvent());</text>

        <!-- Line 5 -->
        <text x="14" y="84" fill="#64748b">  return CompletableFuture.completedFuture(dto);</text>
      </g>

      <!-- n8n Workflow & Automated AI Verification Cards -->
      <g transform="translate(0, 140)">
        <rect width="334" height="86" rx="8" fill="#070d1a" stroke="rgba(16, 185, 129, 0.3)"/>
        
        <!-- Header -->
        <rect width="334" height="24" rx="8" fill="rgba(16, 185, 129, 0.1)"/>
        <text x="14" y="16" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">⚡ AUTONOMOUS AUDIT RESULTS (GEMINI AI)</text>
        <circle cx="316" cy="12" r="4" fill="#10b981"/>

        <!-- Audit metrics row -->
        <g transform="translate(14, 38)">
          <!-- Metric 1 -->
          <rect x="0" y="0" width="94" height="38" rx="6" fill="#0b1324" stroke="rgba(16, 185, 129, 0.3)"/>
          <text x="8" y="14" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="7.5">SECURITY</text>
          <text x="8" y="28" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">0 Flaws</text>

          <!-- Metric 2 -->
          <rect x="104" y="0" width="96" height="38" rx="6" fill="#0b1324" stroke="rgba(45, 212, 191, 0.3)"/>
          <text x="112" y="14" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="7.5">CODE HEALTH</text>
          <text x="112" y="28" fill="#2dd4bf" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">98 / 100</text>

          <!-- Metric 3 -->
          <rect x="210" y="0" width="96" height="38" rx="6" fill="#0b1324" stroke="rgba(245, 158, 11, 0.3)"/>
          <text x="218" y="14" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="7.5">N8N PIPELINE</text>
          <text x="218" y="28" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">Trigger OK</text>
        </g>
      </g>
    </g>
  </g>
</svg>
